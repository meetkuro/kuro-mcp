name: Publish Kuro to MCP Registry

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: mcp-registry-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'meetkuro/kuro-mcp' && github.ref == 'refs/heads/main' && github.actor == 'Quentin967'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out registry metadata
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install MCP Publisher 1.8.1
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --output mcp-publisher.tar.gz https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          printf '%s  %s\n' a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc mcp-publisher.tar.gz | sha256sum --check
          tar -xzf mcp-publisher.tar.gz mcp-publisher
      - name: Validate server metadata
        run: '"$RUNNER_TEMP/mcp-publisher" validate --file server.json'
      - name: Authenticate with GitHub OIDC
        run: '"$RUNNER_TEMP/mcp-publisher" login github-oidc'
      - name: Publish server metadata
        run: '"$RUNNER_TEMP/mcp-publisher" publish server.json'
